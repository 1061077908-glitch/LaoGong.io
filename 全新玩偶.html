/* ========== 高端设计系统变量 三套主题 ========== */
:root{

  --text-secondary:rgba(255,255,255,.68);
  --text-tertiary:rgba(255,255,255,.45);
  --line:rgba(255,255,255,.10);

  --accent:#ff6b35;
  --accent2:#ffb86b;
  --accent-grad:linear-gradient(135deg,#ff6b35,#ffb86b);
  --green:#42e88a;

  --transition-fast:all 0.2s cubic-bezier(0.22, 0, 0.2, 1);
  --transition-normal:all 0.3s cubic-bezier(0.22, 0, 0.2, 1);

  --bg:#0b0f16;
}
/* 霓虹蓝主题 */
body.neon{
  --bg:#070b1a;
  --soft-blur:rgba(8,14,38,.72);
  --card-bg:#0f1529;
  --accent:#35a8ff;
  --accent2:#6bd9ff;

/* 极简冷蓝主题 */
body.cool{

*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{

}
html:not(.fm-native) body{background:var(--bg)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:var(--radius-full)}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}
/* Toast轻提示 */
.toast{

  border:1px solid var(--line);border-radius:var(--radius-full);

}

/* 回到顶部按钮 */
.back-top{

  color:#000;font-size:20px;box-shadow:var(--shadow-soft);

.app{min-height:100vh;padding:16px;max-width:1440px;margin:0 auto}
/* 顶部导航栏 高端毛玻璃 */

}

/* 搜索框 + 搜索下拉联想 */
.search-wrap{flex:1;min-width:260px;position:relative}
.search{

.search-hint{

}
.search-hint.show{display:block}
.search-hint-item{

.search-hint-item:hover{background:rgba(255,255,255,.08)}
/* 按钮系统分层 */
.btn{

.btn.primary{

.tabs,.chips,.filter-row{

.tab,.chip,.filter-tag{

.filter-row{margin:6px 0 12px}
.status-bar{

.tool-group{display:flex;gap:8px}

}
.view-switch button.active{background:rgba(255,255,255,.08);color:var(--text)}
/* 卡片容器 */
.grid{

  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
}
.list-mode{display:flex;flex-direction:column;gap:16px}
.list-mode .card{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:12px}
.list-mode .poster{aspect-ratio:unset;height:160px;width:130px}
/* 剧集封面卡片 高端立体 */
.card{
  border-radius:var(--radius-lg);overflow:hidden;
  background:var(--card-bg);
  border:1px solid var(--line);
  transition:var(--transition-normal);
  cursor:pointer;
  position:relative;
}
.card:hover{
  transform:translateY(-8px) scale(1.025);
  box-shadow:var(--shadow-float);
  border-color:rgba(255,184,107,.4);
}
.poster{
  aspect-ratio:3/4;
  position:relative;overflow:hidden;
  background:#1a222c;
}
.poster::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 50%);
  opacity:0;transition:var(--transition-normal);
}
.card:hover .poster::after{opacity:1}
.poster img{
  width:100%;height:100%;object-fit:cover;
  transition:var(--transition-slow);
  display:block;opacity:0;animation:fadeIn 0.6s forwards;
}
@keyframes fadeIn{to{opacity:1}}
.card:hover .poster img{transform:scale(1.12)}
.noimg{

  color:var(--text-tertiary);font-size:40px;
  background:linear-gradient(145deg,#202833,#11161d);

  display:grid;place-items:center;transition:var(--transition-fast);
}
.fav-btn.active{color:#ff4757}
.quality-badge{

}
.meta{padding:14px 16px}
.name{

}
.remark{

.pager{display:flex;gap:14px;justify-content:center;margin:28px 0;align-items:center}

.panel{

</style>

function saveSearchWords(){localStorage.setItem(STORAGE_KEY_SEARCH_HIST,JSON.stringify(searchWords))}
function saveTheme(mode){localStorage.setItem(STORAGE_KEY_THEME,mode)}
function isFav(item){return favList.some(x=>x.href===item.href)}
function toggleFav(item){
  const idx = favList.findIndex(x=>x.href===item.href);
  if(idx>-1) favList.splice(idx,1),showToast('已取消收藏');
  else favList.unshift(item),showToast('收藏成功');
  saveFav();
  renderGrid(last,true);
}
function addHistory(item){
  const idx = historyList.findIndex(x=>x.href===item.href);
  if(idx>-1) historyList.splice(idx,1);
  historyList.unshift(item);
  if(historyList.length>60) historyList.length=60;
  saveHistory();
}
function addSearchWord(word){
  let idx = searchWords.indexOf(word);
  if(idx>-1) searchWords.splice(idx,1);
  searchWords.unshift(word);
  if(searchWords.length>10) searchWords.length=10;
  saveSearchWords();
}
// 清空收藏/历史
$('#clearHistory').onclick=()=>{
  if(!confirm('确定清空全部浏览历史？'))return;
  historyList=[];saveHistory();renderChips();loadCategory();showToast('已清空历史记录');
}
$('#clearFav').onclick=()=>{
  if(!confirm('确定清空全部收藏？'))return;
  favList=[];saveFav();renderGrid(last,true);showToast('已清空收藏');
}
// Toast轻提示
function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'),1800);
}
// 转义、清理文本
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'"'}[c]))}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
function site(){return SITES.find(x=>x.id===activeSite)||SITES[0]}
function abs(base,u){try{return new URL(u,base+'/').href}catch(e){return u||''}}
// 请求封装
async function req(url){
  status.textContent='请求：'+url;
  if(window.fm&&fm.req){
    let r=await fm.req(url,{method:'GET',headers:{'User-Agent':'Mozilla/5.0','Referer':url},responseType:'text',timeout:16});
    if(!r.ok)throw new Error(r.error||('HTTP '+r.status));
    return r.body||''
  }
  let r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0'}});
  return await r.text()
}
async function get(site,path){
  let lastErr='';
  for(let d of site.domains){
    let u=path.startsWith('http')?path:d.replace(/\/+$/,'')+path;
    try{
      let h=await req(u);
      if(h&&!/just a moment|cf-browser|access denied/i.test(h))return{html:h,base:d.replace(/\/+$/,'')}
    }catch(e){lastErr=e.message}
  }
  throw new Error(lastErr||'全部域名访问失败')
}
function doc(h){return new DOMParser().parseFromString(h,'text/html')}
function imgUrl(u){
  if(!u)return'';
  u=u.replace(/^\/\//,'https://');
  let m=u.match(/^https?:\/\/image\.baidu\.com\/search\/down\?url=([^&]+)/i);
  return m?decodeURIComponent(m[1]):u
}
// 清晰度识别
function getQuality(text){
  if(/4K|2160/i.test(text))return'4K';
  if(/1080|1080P/i.test(text))return'1080P';
  if(/720|720P/i.test(text))return'720P';
  return'';
}
// 卡片数据解析
function cardFrom(el,base,site){
  let a=el.querySelector('a[href]')||el.closest('a[href]')||el,href=a.getAttribute('href')||'';
  let img=el.querySelector('img'),title=a.getAttribute('title')||img&&img.getAttribute('alt')||clean(el.querySelector('.module-item-title,.module-search-item-title,.video-title,.title')?.textContent)||clean(a.textContent);
  let pic=imgUrl(img&&(img.getAttribute('data-src')||img.getAttribute('data-original')||img.getAttribute('src'))||'');
  let remark=clean(el.querySelector('.module-item-note,.module-search-item-note,.video-info,.note')?.textContent)||site.name;
  return{
    title:title.replace(/\s+/g,' ').slice(0,60),
    href:abs(base,href),
    pic:abs(base,pic),
    remark,
    siteId:site.id,
    siteName:site.name,
    quality:getQuality(title+' '+remark)
  }
}
// 渲染站点切换标签
function renderTabs(){
  tabs.innerHTML=SITES.map(s=>`<button class="tab ${activeSite===s.id?'active':''}" data-id="${s.id}">${s.name}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    activeSite=b.dataset.id;
    const s=site();
    if(activeCat==='history'||activeCat==='fav')activeCat=s.cats[2][0];
    page=1;renderTabs();renderChips();loadCategory()
  })
}
// 渲染分类标签
function renderChips(){
  let s=site();
  if(!activeCat&&s.cats[0])activeCat=s.cats[0][0];
  chips.innerHTML=s.cats.map(c=>`<button class="chip ${activeCat===c[0]?'active':''}" data-id="${c[0]}">${c[1]}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b=>b.onclick=async()=>{
    activeCat=b.dataset.id;page=1;renderChips();
    if(activeCat==='history'){renderGrid(historyList,false);status.textContent='浏览历史 · '+historyList.length+' 条'}
    else if(activeCat==='fav'){renderGrid(favList,false);status.textContent='我的收藏 · '+favList.length+' 条'}
    else loadCategory()
  })
}
// 渲染单张卡片HTML
function card(v,i){
  const favActive = isFav(v) ? 'active' : '';
  const qualityTag = v.quality ? `<span class="quality-badge">${esc(v.quality)}</span>` : '';
  const sourceCount = v.sources ? v.sources.length : 1;
  return`
<article class="card" data-i="${i}" data-href="${esc(v.href)}" data-q="${esc(v.quality)}">
  <button class="fav-btn ${favActive}" data-href="${esc(v.href)}">♥</button>
  <div class="poster">
    ${qualityTag}
    ${v.pic?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(v.pic)}" onerror="this.parentElement.innerHTML='<div class=\'noimg\'>影</div>'">`:'<div class="noimg">影</div>'}
    <span class="badge">${esc(v.siteName)}</span>
    <span class="source-badge">${sourceCount}条资源</span>
  </div>
  <div class="meta">
    <div class="name">${esc(v.title)}</div>
    <div class="remark">${esc(v.remark)}</div>
  </div>
</article>`
}
// 渲染列表并过滤清晰度
function renderGrid(list,pager){
  last=list;
  // 清晰度过滤
  let filterList = filterQuality ? list.filter(item=>item.quality===filterQuality) : list;
  content.classList.toggle('list-mode', viewMode==='list');
  content.innerHTML=filterList.length?`<div class="grid">${filterList.map(card).join('')}</div>${pager?`<div class="pager"><button id="prev" ${page<=1?'disabled':''}>上一页</button><span class="page-size">每页${pageLimit}条</span><button id="next">下一页</button></div>`:''}`:'<div class="empty">暂无匹配内容</div>';
  // 收藏按钮
  content.querySelectorAll('.fav-btn').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const h=btn.dataset.href;
      const item=list.find(x=>x.href===h);
      if(item)toggleFav(item)
    }
  })
  // 卡片点击打开详情
  content.querySelectorAll('.card').forEach(c=>c.onclick=(e)=>{
    if(e.target.classList.contains('fav-btn'))return;
    const i=parseInt(c.dataset.i);openDetail(filterList[i])
  });
  let p=$('#prev'),n=$('#next');
  if(p)p.onclick=()=>{if(page>1){page--;loadCategory()}};
  if(n)n.onclick=()=>{page++;loadCategory()}
}
// 分类页面地址拼接
function catUrl(s,c,p){
  if(s.categoryUrl)return s.categoryUrl.replace('{categoryId}',c).replace('{page}',p);
  return `/index.php/vod/show/id/${c}/page/${p}.html`
}
// 加载分类数据
async function loadCategory(){
  content.innerHTML='<div class="empty skeleton">加载中…</div>';
  let s=site();
  try{
    let r=await get(s,catUrl(s,activeCat,page)),d=doc(r.html);
    let els=[...d.querySelectorAll(s.listSelector||'.module-item')];
    let list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,pageLimit);
    renderGrid(list,true);
    status.textContent=`${s.name} · 第 ${page} 页 · 共${list.length}条`
  }catch(e){content.innerHTML='<div class="empty">分类加载失败：'+esc(e.message)+'</div>'}
}
// 单站搜索
async function searchSite(s,q){
  let path=s.searchUrl?s.searchUrl.replace('{keyword}',encodeURIComponent(q)).replace('{page}',1):`/index.php/vod/search/page/1/wd/${encodeURIComponent(q)}.html`;
  let r=await get(s,path),d=doc(r.html);
  let els=[...d.querySelectorAll(s.searchListSelector||'.module-search-item')];
  let list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,pageLimit);
  return list
}
// 名称标准化（聚合去重）
function normName(t){return clean(t).replace(/[《》\[\]【】\s·.\-_:：]/g,'').replace(/第[一二三四五六七八九十\d]+季|Season\s*\d+/ig,'').toLowerCase()}
// 全局搜索
async function search(q){
  if(!q)return;
  addSearchWord(q);
  searchHint.classList.remove('show');
  content.innerHTML='<div class="empty skeleton">聚合搜索中，请稍候…</div>';
  let arr=[];
  if(aggregate){
    let rs=await Promise.allSettled(SITES.map(s=>searchSite(s,q)));
    rs.forEach(r=>{if(r.status==='fulfilled')arr=arr.concat(r.value)});
    let map=new Map();
    arr.forEach(x=>{let k=normName(x.title);if(!map.has(k))map.set(k,Object.assign({},x,{sources:[x]}));else map.get(k).sources.push(x)});
    arr=[...map.values()]
  }else arr=await searchSite(site(),q);
  renderGrid(arr,false);
  status.textContent=`搜索关键词：${q} · 匹配${arr.length}条`
}
// 网盘类型识别
function panType(u){
  u=String(u||'').toLowerCase();
  if(u.includes('pan.baidu'))return'百度';
  if(u.includes('quark'))return'夸克';
  if(u.includes('aliyun')||u.includes('alipan'))return'阿里';
  if(u.includes('xunlei'))return'迅雷';
  if(u.includes('115.com'))return'115';
  if(u.includes('123'))return'123';
  if(u.includes('cloud.189'))return'天翼';
  if(u.includes('caiyun')||u.includes('139'))return'移动';
  return'网盘'
}
// 复制文本
async function copyText(text){
  try{await navigator.clipboard.writeText(text);showToast('链接复制成功')}catch(e){alert('复制失败，请手动复制：'+text)}
}
// 批量复制全部资源
function batchCopyAll(pans){
  let allUrl = pans.map(p=>p.url).join('\n');
  copyText(allUrl);
}
// 解析详情页资源
async function parseDetail(v){
  let sources=v.sources||[v],all=[];
  let main=null;
  for(let src of sources.slice(0,5)){
    let s=SITES.find(x=>x.id===src.siteId)||site();
    try{
      let r=await get(s,src.href),d=doc(r.html);
      if(!main){
        let title=clean(d.querySelector('h1,.title,.module-info-heading h1')?.textContent)||src.title;
        let pic=imgUrl(d.querySelector('.module-info-poster img,.detail-pic img,img')?.getAttribute('src')||src.pic);
        let desc=clean(d.querySelector('.module-info-introduction,.desc,.module-info-content')?.textContent)||'';
        main={title,pic:abs(r.base,pic),desc,siteName:src.siteName}
      }
      let txtEls=[...d.querySelectorAll(s.detailPanSelector||'.module-row-info p')];
      txtEls.forEach(p=>{
        let t=clean(p.textContent);
        if(/^https?:/.test(t))all.push({name:src.siteName+' · '+panType(t),url:t,type:panType(t),siteName:src.siteName})
      });
      [...d.querySelectorAll('a[href]')].forEach(a=>{
        let u=a.getAttribute('href')||'';
        if(/pan\.baidu|quark|aliyun|alipan|xunlei|115\.com|123|cloud\.189|caiyun|magnet:/i.test(u))all.push({name:src.siteName+' · '+(clean(a.textContent)||panType(u)),url:abs(r.base,u),type:panType(u),siteName:src.siteName})
      })
    }catch(e){}
  }
  let seen=new Set();
  all=all.filter(x=>x.url&&!seen.has(x.url)&&(seen.add(x.url)||true));
  return{info:main||v,pans:all}
}
// 打开详情弹窗
async function openDetail(v){
  addHistory(v);
  $('#sheet').classList.add('active');
  $('#panel').innerHTML='<div class="empty skeleton">读取详情资源…</div>';
  try{
    let d=await parseDetail(v),info=d.info;
    $('#panel').innerHTML=`
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
  <button class="btn" id="closeBtn">返回</button>
  ${d.pans.length>0?`<button class="btn primary mini" id="batchCopy">批量复制全部链接</button>`:''}
</div>
<div class="head">
  <img class="pic" referrerpolicy="no-referrer" src="${esc(info.pic||v.pic||'')}" onerror="this.style.display='none'">
  <div>
    <div class="title">${esc(info.title||v.title)}</div>
    <div class="info">
      <div><b>来源站点：</b>${esc((v.sources||[v]).map(x=>x.siteName).join(' / '))}</div>
      <div><b>网盘资源总数：</b>${d.pans.length} 条</div>
      <div><b>清晰度：</b>${v.quality||'未知'}</div>
    </div>
  </div>
</div>
<div class="pill">影片简介</div>
<div class="desc">${esc(info.desc||v.remark||'暂无简介')}</div>
<div class="pill">网盘资源列表</div>
<div class="pan-list">
${d.pans.map((p,i)=>`
<div class="pan-item">
  <span class="pan-type">${esc(p.type)}</span>
  <div>
    <div class="pan-name">${esc(p.name)}</div>
    <div class="pan-url">${esc(p.url)}</div>
  </div>
  <button class="copy-btn" data-link="${esc(p.url)}">复制链接</button>
  <button class="btn mini" data-i="${i}">打开</button>
</div>`).join('')||'<div class="empty">未提取到网盘资源链接</div>'}
</div>`;
    $('#closeBtn').onclick=closeDetail;
    // 批量复制
    if($('#batchCopy'))$('#batchCopy').onclick=()=>batchCopyAll(d.pans);
    // 单条复制
    $('#panel').querySelectorAll('.copy-btn').forEach(btn=>{
      btn.onclick=()=>copyText(btn.dataset.link)
    })
    $('#panel').querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>playPan(d.pans[parseInt(b.dataset.i)]))
  }catch(e){
    $('#panel').innerHTML=`
<button class="btn" onclick="window.__woClose()">返回</button>
<div class="empty">详情读取失败：${esc(e.message)}</div>`
  }
}
// 打开网盘链接
async function playPan(p){
  let u=p.url;
  if(window.fm&&fm.play){
    await fm.play(u.startsWith('magnet:')?u:'push://'+u,p.name);
    return
  }
  location.href=u
}
// 关闭弹窗
function closeDetail(){$('#sheet').classList.remove('active')}
window.__woClose=closeDetail;
// 点击弹窗遮罩关闭
$('#sheet').onclick=(e)=>{if(e.target.id==='sheet')closeDetail()}
// ESC快捷键关闭弹窗
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#sheet').classList.contains('active'))closeDetail();
})
// ===================== 主题切换（三套循环） =====================
const themeList = ['','neon','cool'];
let themeIndex = themeList.indexOf(currentTheme);
$('#themeBtn').onclick=()=>{
  document.body.classList.remove(...themeList);
  themeIndex = (themeIndex+1)%themeList.length;
  let newTheme = themeList[themeIndex];
  if(newTheme) document.body.classList.add(newTheme);
  saveTheme(newTheme);
  showToast(`已切换至${newTheme?newTheme==='neon'?'霓虹蓝':'极简冷蓝':'经典暗黑'}主题`)
}
// ===================== 搜索联想下拉 =====================
function renderSearchHint(){
  if(searchWords.length===0){searchHint.classList.remove('show');return}
  searchHint.innerHTML = searchWords.map(w=>`<div class="search-hint-item">${esc(w)}</div>`).join('');
  searchHint.classList.add('show');
  searchHint.querySelectorAll('.search-hint-item').forEach(item=>{
    item.onclick=()=>{kw.value=item.textContent;searchHint.classList.remove('show');search(kw.value)}
  })
}
kw.onfocus=renderSearchHint;
kw.oninput=()=>{if(!kw.value.trim())searchHint.classList.remove('show')}
document.addEventListener('click',e=>{if(!kw.contains(e.target)&&!searchHint.contains(e.target))searchHint.classList.remove('show')})
// ===================== 视图切换 网格/列表 =====================
$('#gridView').onclick=()=>{
  viewMode='grid';
  $('#gridView').classList.add('active');$('#listView').classList.remove('active');
  renderGrid(last,true);
}
$('#listView').onclick=()=>{
  viewMode='list';
  $('#listView').classList.add('active');$('#gridView').classList.remove('active');
  renderGrid(last,true);
}
// 每页条数切换
$('#pageSizeSel').onchange=()=>{
  pageLimit = parseInt($('#pageSizeSel').value);
  page=1;loadCategory();
}
// ===================== 清晰度筛选 =====================
$('#qualityFilter').querySelectorAll('.filter-tag').forEach(tag=>{
  tag.onclick=()=>{
    $('#qualityFilter').querySelectorAll('.filter-tag').forEach(t=>t.classList.remove('active'));
    tag.classList.add('active');
    filterQuality = tag.dataset.q;
    renderGrid(last,true);
  }
})
// ===================== 回到顶部 =====================
window.addEventListener('scroll',()=>{
  if(window.scrollY>400) backTop.classList.add('visible');
  else backTop.classList.remove('visible');
})
backTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'})
// ===================== 表单提交、聚合切换 =====================
searchForm.onsubmit=e=>{
  e.preventDefault();
  let q=kw.value.trim();
  q?search(q):loadCategory();
  searchHint.classList.remove('show');
};
aggBtn.onclick=()=>{
  aggregate=!aggregate;
  aggBtn.textContent=aggregate?'聚合':'单站';
  showToast(aggregate?'已开启全站聚合搜索':'仅当前站点搜索');
};
// 初始化页面
activeCat=site().cats[2][0];
renderTabs();renderChips();loadCategory();
})();
</script>
</body>
