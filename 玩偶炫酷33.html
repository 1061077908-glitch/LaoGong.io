<!doctype html><html lang="zh-CN">
<head>

<style>
:root{
  --text:#f7fbff;
  --muted:rgba(247,251,255,.68);
  --line:rgba(255,255,255,.16);
  --line-light:rgba(255,255,0.22);
  --soft:rgba(42,50,58,.32);
  --glass-bg:rgba(26,32,42,0.35);
  /* 移除黄色，替换冰蓝+青绿冷霓虹 */
  --cyan:#44e0ff;
  --teal:#42e8c8;
  --cyan-glow:rgba(68,224,255,.3);
  --teal-glow:rgba(66,232,200,.28);
  --danger:#ff6888;
  --radius:18px;
  --radius-xl:24px;
  --touch-min:48px;
  --shadow-soft:0 8px 26px rgba(0,0,0,0.25);
  --shadow-neon:0 0 14px var(--cyan-glow),0 0 28px var(--teal-glow);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif
}
html:not(.fm-native),html:not(.fm-native) body{
  background:#161b24;
  background-image:
    radial-gradient(rgba(68,224,255,0.04) 1px,transparent 1px),
    radial-gradient(rgba(66,232,200,0.03) 1px,transparent 1px);
  background-size:36px 36px;
  background-position:0 0,18px 18px;
}
html.fm-native,body.fm-native{background:transparent}
/* 全局流光动画 */
@keyframes flow-shine{
  0{transform:translateX(-120%) skewX(-20deg)}
  100{transform:translateX(180%) skewX(-20deg)}
}
/* 霓虹呼吸 */
@keyframes breathe-glow{
  0%,100{opacity:0.45}
  50{opacity:0.9}
}
/* 全局玻璃通用 */
.glass{
  background:var(--glass);
  backdrop-filter:blur(16px) saturate(120%);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
  border:1px solid var(--line-light);
  border-radius:var(--radius)
}
.app{
  min-height:100vh;
  padding:12px max(10px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  position:relative
}
.back-top{
  position:fixed;
  right:18px;
  bottom:80px;
  width:var(--touch-min);
  height:var(--touch-min);
  z:35;
  opacity:0;
  pointer-events:none;
  transition:0.24s ease;
}
.back-top.show{opacity:1;pointer-events:auto}
.top-bar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px
}
.brand{
  font-size:23px;
  font-weight:900;
  white-space:nowrap;
  text-shadow:0 0 10px var(--cyan-glow)
}
.brand b{color:var(--cyan)}
.search{
  flex:1;
  display:flex;
  gap:10px;
  align-items:center;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,.18);
  border-radius:999px;
  padding:8px 14px;
  min-height:var(--touch-min)
}
.search input{
  flex:1;
  min-width:0;
  background:transparent;
  border:0;
  outline:0;
  color:var(--text);
  font-size:16px;
  min-height:40px
}
.btn,.search button{
  min-height:var(--touch-min);
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--text);
  border-radius:999px;
  padding:0 16px;
  font-size:14px;
  font-weight:700;
  position:relative;
  overflow:hidden;
  transition:all 0.2s ease;
  display:flex;
  align-items:center;
  justify-content:center;
}
.btn::before,.search button::before,.tab.active::before,.chip.active::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,0.14),transparent 60%);
  animation:flow-shine 3.5s infinite linear;
  opacity:0;
  transition:opacity 0.25s
}
.btn:hover::before,.search button:hover::before,.tab.active::before,.chip.active::before{opacity:1}
.btn:hover,.search button:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-neon)
}
.search button,.primary{

  color:#0e1a22;
  font-weight:800
}
.tab-group,.chips{

  gap:10px;
  overflow-x:auto;
  padding:8px 0;
  scrollbar-width:none;
  margin-bottom:10px
}
.tab-group::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab,.chip{
  white-space:nowrap;
  border-radius:999px;
  padding:9px 16px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,.12);
  color:var(--muted);
  font-weight:700;
  min-height:44px;
  position:relative;
  overflow:hidden;
  transition:all 0.2s
}
.tab.active,.chip.active{
  background:rgba(68,224,255,.13);
  border-color:rgba(68,224,255,.62);
  color:var(--cyan);
  animation:breathe-glow 4s infinite ease-in-out;
  box-shadow:inset 0 0 12px var(--cyan-glow)
}
.tab:hover:not(.active),.chip:hover:not(.active){
  background:rgba(255,255,0.12);
  color:#fff
}
.status{
  margin:12px 2px;
  color:var(--muted);
  font-size:14px;
  padding:6px 10px;
  border-radius:var(--radius);
  background:rgba(255,255,0.05);
  display:inline-block
}
/* 卡片网格 自适应 */
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:10px
}
.grid.compact{gap:8px}
.grid.large{gap:18px}
.card{

  backdrop-filter:blur(10px);
  transition:all 0.26s cubic-bezier(0.2,0,0.2,1);
  position:relative
}
.card .fav-mark{
  position:absolute;
  top:10px;
  left:10px;
  width:26px;height:26px;
  border-radius:50%;
  background:rgba(68,224,255,.35);
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:bold;
  z:2
}
.card:hover{

  border-color:var(--cyan);
  box-shadow:var(--shadow-neon)
}
.poster{
  aspect-ratio:3/4;
  background:rgba(255,255,255,.08);
  position:relative;
  overflow:hidden
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;

.card:hover .poster img{transform:scale(1.06)}
.noimg{
  height:100%;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:28px

.badge{
  position:absolute;
  right:8px;
  top:8px;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(0,0,0,.62);
  font-size:11px;
  font-weight:800;
  backdrop-filter:blur(6px)

.meta{padding:10px}
.name{

  font-size:14px;
  white-space:nowrap;
  overflow:hidden;

.remark{

}
.pager{

/* 详情弹窗 */
.sheet{

.pic{

  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:var(--radius);
  background:rgba(255,255,.08);
  overflow:hidden

.title{
  font-size:24px;
  font-weight:700;
  line-height:1.25;

.info{

  line-height:1.65;

  overflow:hidden;
  margin-top:10px

.ctrl-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0
}
.pill{
  display:inline-block;
  margin:18px 0 10px;
  padding:9px 20px;
  border-radius:999px;
  background:rgba(255,255,.10);
  border:1px solid rgba(68,224,255,.55);
  font-size:15px;
  font-weight:800
}
.desc{
  font-size:15px;
  line-height:1.75;
  color:rgba(255,255,.72)
}
.pan-list{display:grid;gap:10px;margin-top:8px}
.pan-item{
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  gap:12px;
  align-items:center;
  padding:12px;
  border-radius:var(--radius);
  background:rgba(255,255,.09);
  border:1px solid rgba(255,255,.14);
  transition:0.2s
}
.pan-item:hover{background:rgba(255,255,0.14)}
.pan-type{
  padding:5px 10px;
  border-radius:999px;
  background:rgba(68,224,255,.18);
  color:var(--cyan);
  font-size:12px;
  font-weight:900
}
.pan-name{
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.pan-url{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.empty{
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
  background:var(--soft);
  border:1px dashed var(--line);
  border-radius:var(--radius);
  margin:10px 0
}
.toast{
  position:fixed;
  left:50%;
  bottom:40px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(10,14,22,.86);
  backdrop-filter:blur(16px);
  border:1px solid var(--cyan-glow);
  color:#fff;
  padding:10px 20px;
  border-radius:999px;
  z-index:99;
  opacity:0;
  pointer-events:none;
  transition:0.22s
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 平板媒体查询 */
@media(min-width:720px){
  .app{padding:20px 32px}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .head{grid-template-columns:190px 1fr}
  .pic{width:190px}
  .top-bar{gap:16px}
}
@media(min-width:1100px){
  .app{max-width:1440px;margin:0 auto;padding:24px 40px}
  .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
  .panel{padding:24px 22px 32px}
}
</style>
</head>

  let a=el.querySelector('a[href]')||el.closest('a[href]')||el,href=a.getAttribute('href')||'',
  img=el.querySelector('img'),
  title=a.getAttribute('title')||img&&img.getAttribute('alt')||clean(el.querySelector('.module-item-title,.module-search-item,.title')?.textContent)||clean(a.textContent),
  pic=imgUrl(img&&(img.dataset.src||img.dataset.original||img.src)||''),
  remark=clean(el.querySelector('.module-item-note,.video-info,.note')?.textContent)||site.name;
  return{title:title.replace(/\s+/g,' ').slice(0,60),href:abs(base,pic?href:href),pic:abs(base,pic),remark,siteId:site.id,siteName:site.name}
}
function renderTabs(){
  tabs.innerHTML=SITES.map(s=>`<button class="tab ${activeSite===s.id?'active':''}" data-id="${s.id}">${s.name}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    activeSite=b.dataset.id;activeCat=site().cats[0][0];page=1;renderTabs();renderChips();loadCategory()
  })
}
function renderChips(){
  let s=site();
  if(!activeCat&&s.cats[0])activeCat=s.cats[0][0];
  chips.innerHTML=s.cats.map(c=>`<button class="chip ${activeCat===c[0]?'active':''}" data-id="${c[0]}">${c[1]}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    activeCat=b.dataset.id;page=1;renderChips();loadCategory()
  })
}
function card(v,i){
  const favIcon = isF(v) ? `<span class="fav-mark">★</span>` : "";
  return`<article class="card" data-i="${i}">${favIcon}<div class="poster">${v.pic?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(v.pic)}">`:'<div class="noimg">偶</div>'}<span class="badge">${esc(v.siteName)}</span></div><div class="meta"><div class="name">${esc(v.title)}</div><div class="remark">${esc(v.remark)}</div></article>`
}
function renderGrid(list,pager){
  last=list;
  const gridClass=gridMode==="compact"?"grid compact":gridMode==="large"?"grid large":"grid";
  content.innerHTML=list.length?`<div class="${gridClass}">${list.map((v,i)=>card(v,i)).join('')}</div>${pager?`<div class="pager"><button id="prev" ${page<=1?'disabled':''}><上一页</button><button id="next">下一页</button></div>`:''}`:'<div class="empty">暂无影片</div>';
  content.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    const item=list[parseInt(c.dataset.i)];
    addHistory(item);
    openDetail(item);
  });
  let p=$('#prev'),n=$('#next');
  if(p)p.onclick=()=>{if(page>1){page--;loadCategory()}};
  if(n)n.onclick=()=>{page++;loadCategory()}
}
function catUrl(s,c,p){
  if(s.categoryUrl)return s.categoryUrl.replace('{categoryId}',c).replace('{page}',p);
  return `/index.php/vod/show/id/${c}/page/${p}.html`
}
async function loadCategory(){
  content.innerHTML='<div class="empty">加载中…</div>';
  let s=site();
  try{
    let r=await get(s,catUrl(s,activeCat,page)),d=doc(r.html),els=[...d.querySelectorAll(s.listSelector||'.module-item')],
    list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,60);
    renderGrid(list,true);
    status.textContent=`${s.name} · 第${page}页 · ${list.length}部`
  }catch(e){
    content.innerHTML='<div class="empty">分类加载失败：'+esc(e.message)+'</div>'
  }
}
async function searchSite(s,q){
  let path=s.searchUrl?s.searchUrl.replace('{keyword}',encodeURIComponent(q)).replace('{page}',1):`/index.php/vod/search/page/1/wd/${encodeURIComponent(q)}.html`;
  let r=await get(s,path),d=doc(r.html),els=[...d.querySelectorAll(s.searchListSelector||'.module-search-item')];
  return els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,20)
}
function normName(t){return clean(t).replace(/[《》\[\]【】\s·.\-_:：]/g,'').replace(/第[一二三四五六七八九十\d]+季|Season\s*\d+/ig,'').toLowerCase()}
async function search(q){
  content.innerHTML='<div class="empty">聚合搜索中…</div>';
  let arr=[];
  if(aggregate){
    let rs=await Promise.allSettled(SITES.map(s=>searchSite(s,q)));
    rs.forEach(r=>{if(r.status==='fulfilled')arr=arr.concat(r.value)});
    let map=new Map();
    arr.forEach(x=>{let k=normName(x.title);if(!map.has(k))map.set(k,Object.assign({},x,{sources:[x]}));else map.get(k).sources.push(x)});
    arr=[...map.values()]
  }else arr=await searchSite(s,q);
  renderGrid(arr,false);
  status.textContent=`搜索「${q}」共${arr}条`
}
function panType(u){
  u=String(u||'').toLowerCase();
  if(u.includes('pan.baidu'))return'百度';
  if(u.includes('quark'))return'夸克';
  if(u.includes('aliyun')||u.includes('alipan'))return'阿里';
  if(u.includes('xunlei'))return'迅雷';
  if(u.includes('115.com'))return'115';
  if(u.includes('123'))return'123';
  if(u.includes('cloud.189'))return'天翼';
  if(u.includes('caiyun')||u.includes('139'))return'移动';
  return'网盘'
}
async function parseDetail(v){
  let sources=v.sources||[v],all=[];
  let main=null;
  for(let src of sources.slice(0,5)){
    let s=SITES.find(x=>x.id===src.siteId)||site();
    try{
      let r=await get(s,src.href),d=doc(r.html);
      if(!main){
        let title=clean(d.querySelector('h1,.title,.module-info-heading h1')?.textContent)||src.title,
        pic=imgUrl(d.querySelector('.module-info-poster img,.detail-pic img,img')?.src||src.pic),
        desc=clean(d.querySelector('.module-info-introduction,.desc')?.textContent)||'';
        main={title,pic:abs(r.base,pic),desc,siteName:src.siteName}
      }
      let txtEls=[...d.querySelectorAll(s.detailPanSelector||'.module-row-info p')];
      txtEls.forEach(p=>{let t=clean(p.textContent);if(/^https?:/.test(t))all.push({name:src.siteName+' · '+panType(t),url:t,type:panType(t),siteName:src.siteName})});
      [...d.querySelectorAll('a[href]')].forEach(a=>{let u=a.getAttribute('href')||'';if(/pan\.baidu|quark|aliyun|xunlei|115|magnet/i.test(u))all.push({name:src.siteName+' · '+clean(a.textContent)||panType(u),url:abs(r.base,u),type:panType(u)})})
    }catch(e){}
  }
  let seen=new Set();
  all=all.filter(x=>x.url&&!seen.has(x)&&(seen.add(x.url)||true));
  return{info:main||v,pans:all,originItem:v}
}
async function openDetail(v){
  $('#sheet').classList.add('active');
  $('#panel').innerHTML='<div class="empty">读取详情…</div>';
  try{
    let d=await parseDetail(v),info=d.info;
    const favText = isFav(v) ? "取消收藏" : "收藏影片";
    $('#panel').innerHTML=`
    <div class="ctrl-row">
      <button class="btn" id="closeBtn">返回</button>
      <button class="btn primary" id="favToggleBtn">${favText}</button>
      ${d.pans.length>1?`<button class="btn primary" id="copyAllBtn">批量复制全部链接</button>`:''}
    </div>
    <div class="head">
      <img class="pic" referrerpolicy="no-referrer" src="${esc(info.pic||v.pic||'')}" onerror="this.style.display='none'">
      <div>
        <div class="title">${esc(info.title)}</div>
        <div class="info">
          <div><b>来源：</b>${esc((v.sources||[v]).map(x=>x.siteName).join(' / '))}</div>
          <div><b>资源：</b>${d.pans.length} 条</div>
        </div>
      </div>
    </div>
    <div class="pill">简介</div>
    <div class="desc">${esc(info.desc||v.remark||'暂无简介')}</div>
    <div class="pill">网盘资源</div>
    <div class="pan-list">${d.pans.map((p,i)=>`<div class="pan-item"><span class="pan-type">${esc(p.type)}</span><div><div class="pan-name">${esc(p.name)}</div><div class="pan-url">${esc(p.url)}</div></div><button class="btn copy-single">复制</button><button class="btn play-btn">打开</button>`).join('')||'<div class="empty">未获取网盘链接</div>'}</div>`;
    // 收藏切换按钮
    $('#favToggleBtn').onclick=()=>toggleF(v);
    // 批量复制
    if($('#copyAllBtn'))$('#copyAllBtn').onclick=()=>copyAllPans(d.pans);
    // 单条复制
    document.querySelectorAll('.copy-single').forEach(btn=>btn.onclick=async()=>{
      const url=btn.closest('.pan-item').querySelector('.pan-url').textContent;
      await navigator.clipboard.writeText(url).catch(()=>{
        const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
      });showToast("链接已复制");
    })
    // 打开网盘
    document.querySelectorAll('.play-btn').forEach(b=>b.onclick=()=>{
      const url=b.closest('.pan-item').querySelector('.pan-url').textContent;
      playPan({url,name:b.closest('.pan-name').textContent})
    })
    $('#closeBtn').onclick=closeDetail;
  }catch(e){
    $('#panel').innerHTML='<button class="btn" onclick="window.__woClose()">返回</button><div class="empty">读取失败：'+esc(e.message)+'</div>'
  }
}
// 批量复制网盘
async function copyAllPans(list){
  const text=list.map(p=>`${p.name}\n${p.url}`).join('\n\n');
  try{
    await navigator.clipboard.writeText(text);
    showToast(`复制${list.length}条网盘链接`);
  }catch(e){
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast("复制成功（兼容模式）");
  }
}
async function playPan(p){
  let u=p.url;
  if(window.fm&&fm.play){
    await fm.play(u.startsWith('magnet')?u:'push://'+u,p.name);
    return
  }
  location.href=u
}
function closeDetail(){$('#sheet').classList.remove('active')}
searchForm.onsubmit=e=>{e.preventDefault();let q=kw.value.trim();q?search(q):loadCategory()};
aggBtn.onclick=()=>{aggregate=!aggregate;aggBtn.textContent=aggregate?'聚合':'单站';showToast(aggregate?'开启多站':'仅当前站点')};
window.__woClose=closeDetail;
activeCat=site().cats[0][0];
renderTabs();renderChips();loadCategory();
})();
</script>
</body></html>
