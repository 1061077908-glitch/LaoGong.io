<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>玩偶聚合 WebHome | Tab S9 优化版</title>
<style>
/* ========== One UI 主题变量 适配三星AMOLED ========== */
:root{
  --text:#ffffff;
  --muted:rgba(255,255,255,.65);
  --line:rgba(255,255,255,.12);
  --soft:rgba(30,38,48,.35);
  --soft-blur:rgba(22,28,36,.6);
  --accent:#ff6b35;
  --accent2:#ffb86b;
  --accent-grad:linear-gradient(135deg,#ff6b35,#ffb86b);
  --green:#42e88a;
  --green-glow:0 0 14px rgba(66,232,138,.35);
  --radius-xl:26px;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-full:999px;
  --shadow-deep:0 10px 30px rgba(0,0,0,.45);
  --shadow-soft:0 4px 16px rgba(0,0,0,.25);
  --transition-fast:all 0.18s cubic-bezier(0.2,0,0.2,1);
  --transition-slow:all 0.3s cubic-bezier(0.2,0,0.2,1);
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{
  margin:0;min-height:100%;
  /* OLED纯黑背景，省电深邃 */
  background:#0d1117;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Samsung Sans",Arial,sans-serif;
  scroll-behavior:smooth;
}
html:not(.fm-native) body{background:#0d1117}
/* 全局滚动美化 三星平板 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.05)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:var(--radius-full)}

.app{min-height:100vh;padding:16px}
/* 顶部导航栏 玻璃模糊 */
.bar{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  background:var(--soft-blur);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  margin-bottom:16px;
  box-shadow:var(--shadow-soft);
}
.brand{
  font-size:24px;font-weight:900;white-space:nowrap;
  letter-spacing:0.5px;
}
.brand b{background:var(--accent-grad);-webkit-background-clip:text;color:transparent}
/* 搜索框 放大触控区 平板友好 */
.search{
  flex:1;display:flex;gap:10px;align-items:center;
  background:rgba(255,255,255,.07);
  border:1px solid var(--line);
  border-radius:var(--radius-full);
  padding:10px 16px 10px 20px;
  transition:var(--transition-fast);
}
.search:focus-within{
  border-color:rgba(255,107,53,.4);
  box-shadow:0 0 0 3px rgba(255,107,53,.12);
  background:rgba(255,255,255,.09);
}
.search input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:var(--text);font-size:16px;padding:4px 0;
}
.search input::placeholder{color:var(--muted)}
/* 按钮通用样式 悬浮发光 */
.search button,.btn{
  border:1px solid var(--line);
  background:var(--soft);color:var(--text);
  border-radius:var(--radius-full);
  padding:10px 16px;font-size:15px;font-weight:600;
  transition:var(--transition-fast);
  min-width:80px;
}
.search button:hover,.btn:hover{
  transform:translateY(-2px);box-shadow:var(--shadow-soft);
  background:rgba(255,255,255,.1);
}
.search button,.primary{
  border-color:rgba(255,107,53,.45);
  background:var(--accent-grad);
  color:#0a0603;font-weight:800;
}
.search button:active,.primary:active{transform:scale(0.96)}
/* 分类标签栏 横向滚动 */
.tabs,.chips{
  display:flex;gap:10px;overflow:auto;padding:0 4px 10px;
  scrollbar-width:none;
}
.tab,.chip{
  white-space:nowrap;border-radius:var(--radius-full);
  padding:10px 18px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);color:var(--muted);
  font-weight:700;font-size:15px;
  transition:var(--transition-fast);
  min-height:44px;
}
.tab:hover,.chip:hover{background:rgba(255,255,255,.1)}
.tab.active,.chip.active{
  background:rgba(66,232,138,.12);
  border-color:rgba(66,232,138,.6);
  color:var(--green);font-weight:900;
  box-shadow:var(--green-glow);
}
.status{margin:12px 4px;color:var(--muted);font-size:14px}
/* 影片网格 Tab S9大屏多列 */
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
/* 影片卡片 悬浮动效 核心炫酷效果 */
.card{
  border-radius:var(--radius-lg);overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:1px solid var(--line);
  transition:var(--transition-fast);
  cursor:pointer;
}
.card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:var(--shadow-deep);
  border-color:rgba(255,184,107,.3);
}
.poster{
  aspect-ratio:3/4;background:rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.poster img{
  width:100%;height:100%;object-fit:cover;
  transition:var(--transition-slow);
}
.card:hover .poster img{transform:scale(1.08)}
.noimg{
  height:100%;display:grid;place-items:center;
  color:var(--muted);font-size:32px;
}
.badge{
  position:absolute;right:8px;top:8px;
  padding:4px 10px;border-radius:var(--radius-full);
  background:rgba(0,0,0,.65);font-size:11px;font-weight:800;
  backdrop-filter:blur(4px);
}
.meta{padding:10px 12px}
.name{
  font-weight:800;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.remark{
  margin-top:6px;color:var(--muted);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 分页按钮 */
.pager{display:flex;gap:12px;justify-content:center;margin:20px 0}
.pager button{
  padding:12px 24px;border-radius:var(--radius-full);
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  color:var(--text);font-size:15px;transition:var(--transition-fast);
  min-width:110px;
}
.pager button:hover{background:rgba(255,255,255,.12)}
.pager button:disabled{opacity:0.35;cursor:not-allowed;transform:none}
/* 详情弹窗 全屏毛玻璃 */
.sheet{
  position:fixed;inset:0;z-index:40;display:none;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  overflow:auto;padding:16px;
}
.sheet.active{display:block}
.panel{
  background:linear-gradient(145deg,rgba(48,32,28,.65),rgba(18,22,28,.6));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--radius-xl);
  padding:20px 18px 28px;margin:0 auto 40px;
  max-width:1100px;box-shadow:var(--shadow-deep);
}
.head{display:grid;grid-template-columns:38% 1fr;gap:18px}
.pic{
  width:100%;aspect-ratio:3/4;object-fit:cover;
  border-radius:var(--radius-lg);background:rgba(255,255,255,.06);
  box-shadow:var(--shadow-soft);
}
.title{font-size:26px;font-weight:700;line-height:1.2}
.info{
  font-size:15px;line-height:1.7;color:rgba(255,255,255,.78);
  max-height:260px;overflow:auto;margin:10px 0;
}
.pill{
  display:inline-block;margin:20px 0 12px;padding:10px 22px;
  border-radius:var(--radius-full);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,184,107,.5);font-size:16px;font-weight:800;
}
.desc{font-size:16px;line-height:1.8;color:rgba(255,255,255,.75)}
/* 网盘资源列表 */
.pan-list{display:grid;gap:12px;margin-top:10px}
.pan-item{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;
  align-items:center;padding:14px;border-radius:var(--radius-lg);
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  transition:var(--transition-fast);
}
.pan-item:hover{background:rgba(255,255,255,.11)}
.pan-type{
  padding:5px 10px;border-radius:var(--radius-full);
  background:rgba(255,184,107,.18);color:var(--accent2);
  font-size:13px;font-weight:900;min-width:60px;text-align:center;
}
.pan-name{
  font-size:15px;font-weight:900;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pan-url{
  color:var(--muted);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.empty{
  padding:40px 20px;text-align:center;color:var(--muted);
  background:var(--soft);border:1px dashed var(--line);
  border-radius:var(--radius-xl);font-size:15px;
}
/* ========== 三星Tab S9 大屏媒体查询 ========== */
/* 720px+ 横屏小平板 */
@media(min-width:720px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .app{padding:24px 32px}
  .head{grid-template-columns:200px 1fr}
  .pic{width:200px}
  .bar{padding:14px 20px}
}
/* 1100px+ Tab S9 11寸大屏 7列铺满 */
@media(min-width:1100px){
  .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
  .app{max-width:1420px;margin:0 auto}
  .sheet{max-width:1200px;margin:0 auto}
}
</style>
</head>

</div>

);let map=new Map();arr.forEach(x=>{let k=normName(x.title);if(!map.has(k))map.set(k,Object.assign({},x,{sources:[x]}));else map.get(k).sources.push(x)});arr=[...map.values()]}else arr=await searchSite(site(),q);renderGrid(arr,false);status.textContent=`搜索：${q} · ${arr.length} 条`}function panType(u){u=String(u||'').toLowerCase();if(u.includes('pan.baidu'))return'百度';if(u.includes('quark'))return'夸克';if(u.includes('aliyun')||u.includes('alipan'))return'阿里';if(u.includes('xunlei'))return'迅雷';if(u.includes('115.com'))return'115';if(u.includes('123'))return'123';if(u.includes('cloud.189'))return'天翼';if(u.includes('caiyun')||u.includes('139'))return'移动';return'网盘'}async function parseDetail(v){let sources=v.sources||[v],all=[];let main=null;for(let src of sources.slice(0,5)){let s=SITES.find(x=>x.id===src.siteId)||site();try{let r=await get(s,src.href),d=doc(r.html);if(!main){let title=clean(d.querySelector('h1,.title,.module-info-heading h1')?.textContent)||src.title,pic=imgUrl(d.querySelector('.module-info-poster img,.detail-pic img,img')?.getAttribute('src')||src.pic),desc=clean(d.querySelector('.module-info-introduction,.desc,.module-info-content')?.textContent)||'';main={title,pic:abs(r.base,pic),desc,siteName:src.siteName}}let txtEls=[...d.querySelectorAll(s.detailPanSelector||'.module-row-info p')];txtEls.forEach(p=>{let t=clean(p.textContent);if(/^https?:/.test(t))all.push({name:src.siteName+' · '+panType(t),url:t,type:panType(t),siteName:src.siteName})});[...d.querySelectorAll('a[href]')].forEach(a=>{let u=a.getAttribute('href')||'';if(/pan\.baidu|quark|aliyun|alipan|xunlei|115\.com|123|cloud\.189|caiyun|magnet:/i.test(u))all.push({name:src.siteName+' · '+(clean(a.textContent)||panType(u)),url:abs(r.base,u),type:panType(u),siteName:src.siteName})})}catch(e){}}let seen=new Set();all=all.filter(x=>x.url&&!seen.has(x.url)&&(seen.add(x.url)||true));return{info:main||v,pans:all}}async function openDetail(v){$('#sheet').classList.add('active');$('#panel').innerHTML='<div class="empty">读取详情…</div>';try{let d=await parseDetail(v),info=d.info;$('#panel').innerHTML=`<button class="btn" id="closeBtn">返回</button><div class="head"><img class="pic" referrerpolicy="no-referrer" src="${esc(info.pic||v.pic||'')}" onerror="this.style.display='none'"><div><div class="title">${esc(info.title||v.title)}</div><div class="info"><div><b>来源：</b>${esc((v.sources||[v]).map(x=>x.siteName).join(' / '))}</div><div><b>资源：</b>${d.pans.length} 条</div></div></div></div>
<div class="pill">简介</div><div class="desc">${esc(info.desc||v.remark||'暂无简介')}</div><div class="pill">网盘资源</div><div class="pan-list">${d.pans.map((p,i)=>`<div class="pan-item"><span class="pan-type">${esc(p.type)}</span><div><div class="pan-name">${esc(p.name)}</div><div class="pan-url">${esc(p.url)}</div></div><button class="btn" data-i="${i}">打开</button></div>`).join('')||'<div class="empty">未提取到网盘链接</div>'}</div>`;$('#closeBtn').onclick=closeDetail;$('#panel').querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>playPan(d.pans[parseInt(b.dataset.i)]))}catch(e){$('#panel').innerHTML='<button class="btn" onclick="window.__woClose()">返回</button><div class="empty">详情失败：'+esc(e.message)+'</div>'}}async function playPan(p){let u=p.url;if(window.fm&&fm.play){await fm.play(u.startsWith('magnet:')?u:'push://'+u,p.name);return}location.href=u}function closeDetail(){$('#sheet').classList.remove('active')}searchForm.onsubmit=e=>{e.preventDefault();let q=kw.value.trim();q?search(q):loadCategory()};aggBtn.onclick=()=>{aggregate=!aggregate;aggBtn.textContent=aggregate?'聚合':'单站'};window.__woClose=closeDetail;activeCat=site().cats[0][0];renderTabs();renderChips();loadCategory();})();</script>
