<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>玩偶聚合 WebHome | 平板影视海报模式</title>
<style>
:root{
    /* 影视APP深色主题配色 */
    --bg-main:#0f141b;
    --bg-gradient:linear-gradient(160deg,#0f141b,#1c2530);
    --glass-bg:rgba(22,30,40,0.72);
    --card-glass:rgba(255,255,255,0.06);
    --soft:rgba(255,255,255,.07);
    --soft-hover:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.12);
    --accent:#ffb86b;
    --accent-orange:#ff6b35;
    --green:#42e88a;
    --text:#f7fbff;
    --text-muted:rgba(247,251,255,.62);
    --text-light:rgba(247,251,255,.88);
    /* 圆角规范 影视APP大圆角风格 */
    --radius-full:999px;
    --radius-sm:12px;
    --radius-md:16px;
    --radius-lg:20px;
    --radius-xl:28px;
    /* 阴影过渡 */
    --shadow-card:0 8px 22px rgba(0,0,0,0.36);
    --shadow-hover:0 14px 36px rgba(0,0,0,0.5);
    --shadow-panel:0 16px 50px rgba(0,0,0,0.6);
    --transition:all 0.28s cubic-bezier(0.2,0,0.2,1);
}
*{box-sizing:border-box}
html,body{
    margin:0;
    min-height:100%;
    background:transparent;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    letter-spacing:0.2px;
}
html:not(.fm-native),html:not(.fm-native) body{
    background:var(--bg-gradient);
}
.app{
    min-height:100vh;
    padding:16px 16px 48px;
}
/* 顶部导航栏 */
.bar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}
.brand{
    font-size:24px;
    font-weight:900;
    white-space:nowrap;
    background:linear-gradient(90deg,#fff,var(--accent));
    -webkit-background-clip:text;
    color:transparent;
}
.brand b{
    color:var(--accent);
}
/* 搜索框 */
.search{
    flex:1;
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:var(--radius-full);
    padding:10px 14px 10px 18px;
    transition:var(--transition);
}
.search:focus-within{
    border-color:var(--accent);
    background:var(--soft-hover);
    box-shadow:0 0 0 4px rgba(255,184,107,0.1);
}
.search input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:var(--text);
    font-size:16px;
}
.search input::placeholder{
    color:var(--text-muted);
}
/* 通用按钮 影视圆角按钮 */
.btn,.search button{
    border:none;
    background:var(--soft);
    color:var(--text);
    border-radius:var(--radius-full);
    padding:10px 16px;
    font-size:15px;
    cursor:pointer;
    transition:var(--transition);
}
.btn:hover,.search button:hover{
    background:var(--soft-hover);
    transform:translateY(-2px);
}
.btn:active,.search button:active{
    transform:translateY(0);
}
.primary{
    background:linear-gradient(135deg,var(--accent-orange),var(--accent));
    color:#0a0704;
    font-weight:800;
}
/* 站点分类横向标签 */
.tabs,.chips{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:6px 2px 14px;
    scrollbar-width:none;
    margin-bottom:8px;
}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab,.chip{
    white-space:nowrap;
    border-radius:var(--radius-full);
    padding:10px 18px;
    background:var(--soft);
    border:1px solid transparent;
    color:var(--text-muted);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:var(--transition);
}
.tab:hover,.chip:hover{
    background:var(--soft-hover);
    color:var(--text-light);
}
.tab.active,.chip.active{
    background:rgba(255,184,107,.16);
    border-color:var(--accent);
    color:var(--accent);
    font-weight:900;
}
/* 状态文字 */
.status{
    margin:10px 6px 20px;
    color:var(--text-muted);
    font-size:14px;
}
/* ====================== 平板海报模式核心网格 ====================== */
.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
}
/* 海报卡片 90%高度为封面，底部仅小字标题 */
.card{
    border-radius:var(--radius-lg);
    overflow:hidden;
    background:#000;
    box-shadow:var(--shadow-card);
    transition:var(--transition);
    cursor:pointer;
    aspect-ratio:2 / 3.3; /* 标准影视竖海报比例 */
    display:flex;
    flex-direction:column;
}
.card:hover{
    transform:translateY(-8px) scale(1.03);
    box-shadow:var(--shadow-hover);
}
.poster{
    flex:1;
    position:relative;
    overflow:hidden;
}
.poster img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform 0.4s ease;
}
.card:hover .poster img{
    transform:scale(1.08);
}
.noimg{
    height:100%;
    display:grid;
    place-items:center;
    color:var(--text-muted);
    font-size:36px;
    background:linear-gradient(145deg,#222830,#11151a);
}
/* 右上角来源标签 */
.badge{
    position:absolute;
    right:10px;
    top:10px;
    padding:5px 10px;
    border-radius:var(--radius-full);
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(6px);
    font-size:12px;
    font-weight:800;
    border:1px solid rgba(255,255,255,.12);
}
/* 底部极简文字栏 */
.meta{
    padding:10px 10px 12px;
    background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);
}
.name{
    font-weight:800;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.remark{
    display:none; /* 海报模式隐藏多余备注，只看封面 */
}
/* 分页按钮 */
.pager{
    display:flex;
    gap:14px;
    justify-content:center;
    margin:30px 0 16px;
}
.pager button{
    padding:12px 26px;
    border-radius:var(--radius-full);
    background:var(--soft);
    border:none;
    color:var(--text);
    cursor:pointer;
    transition:var(--transition);
    font-size:16px;
}
.pager button:hover{
    background:var(--soft-hover);
}
.pager button:disabled{
    opacity:0.3;
    cursor:not-allowed;
    transform:none !important;
}
/* ====================== 详情弹窗 完全复刻截图海报头部 ====================== */
.sheet{
    position:fixed;
    inset:0;
    z-index:99;
    display:none;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(12px);
    overflow-y:auto;
    animation:fadeIn 0.3s ease;
}
.sheet.active{display:block}
@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}
.panel{
    margin:0 auto 60px;
    max-width:1300px;
    background:var(--glass-bg);
    backdrop-filter:blur(18px);
    border-radius:var(--radius-xl);
    overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:var(--shadow-panel);
}
/* 弹窗顶部全屏海报背景（对标截图大图） */
.detail-banner{
    width:100%;
    height:520px;
    position:relative;
}
.detail-banner-img{
    width:100%;
    height:100%;
    object-fit:cover;
}
/* 底部渐变遮罩，让文字看清 */
.banner-mask{
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
}
/* 海报上标题信息 */
.banner-info{
    position:absolute;
    bottom:40px;
    left:36px;
    right:36px;
}
.detail-title{
    font-size:42px;
    font-weight:900;
    margin:0 0 12px;
    background:linear-gradient(90deg,#fff,#ffd399);
    -webkit-background-clip:text;
    color:transparent;
}
.detail-meta-tags{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
}
.meta-tag{
    padding:6px 14px;
    border-radius:var(--radius-full);
    background:rgba(255,255,255,.12);
    font-size:14px;
}
.detail-desc{
    font-size:16px;
    line-height:1.7;
    color:var(--text-light);
    max-width:900px;
}
/* 海报下方两个功能按钮：搜索播放 / 盘搜 */
.detail-buttons{
    padding:24px 36px;
    display:flex;
    gap:16px;
}
/* 网盘分类Tab栏 */
.cloud-tab-wrap{
    padding:0 36px 12px;
}
.cloud-tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
}
.cloud-tabs::-webkit-scrollbar{display:none}
.cloud-tab{
    padding:8px 16px;
    border-radius:var(--radius-full);
    background:var(--soft);
    white-space:nowrap;
    font-size:14px;
    color:var(--text-muted);
}
.cloud-tab.active{
    background:var(--accent);
    color:#000;
    font-weight:800;
}
/* 网盘资源列表区域 */
.cloud-list-wrap{
    padding:0 36px 32px;
}
.cloud-list-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.pan-list{
    display:grid;
    gap:14px;
}
.pan-item{
    padding:16px;
    border-radius:var(--radius-md);
    background:var(--card-glass);
    border:1px solid var(--line);
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:14px;
    align-items:center;
    transition:var(--transition);
}
.pan-item:hover{
    background:var(--soft-hover);
    border-color:var(--accent);
}
.pan-type{
    padding:6px 12px;
    border-radius:var(--radius-full);
    background:rgba(255,184,107,.18);
    color:var(--accent);
    font-size:13px;
    font-weight:900;
    white-space:nowrap;
}
.pan-name{
    font-size:15px;
    font-weight:700;
}
.pan-url{
    font-size:12px;
    color:var(--text-muted);
    margin-top:4px;
    word-break:break-all;
}
/* 底部横向分集海报栏（对标截图分季分集横向滚动） */
.episode-wrap{
    padding:0 36px 40px;
}
.episode-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:16px;
}
.episode-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:none;
}
.episode-scroll::-webkit-scrollbar{display:none}
.episode-card{
    width:160px;
    flex-shrink:0;
    border-radius:var(--radius-md);
    overflow:hidden;
    aspect-ratio:16 / 9;
    background:#000;
    position:relative;
}
.episode-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.episode-num{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:6px;
    background:linear-gradient(to top,#000,transparent);
    font-size:13px;
}
/* 关闭按钮 */
#closeBtn{
    position:absolute;
    top:24px;
    right:36px;
    z-index:10;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(4px);
}
/* 空状态 */
.empty{
    padding:60px 24px;
    text-align:center;
    color:var(--text-muted);
    background:var(--card-glass);
    border:1px dashed var(--line);
    border-radius:var(--radius-md);
    font-size:16px;
}
/* ====================== 安卓平板横屏适配规则 ====================== */
@media(min-width:720px){
    .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
    .app{padding:24px 32px 56px}
    .detail-banner{height:600px}
    .detail-title{font-size:48px}
    .episode-card{width:200px}
}
@media(min-width:1100px){
    .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:26px}
    .app{max-width:1500px;margin:0 auto}
    .panel{max-width:1350px}
    .detail-banner{height:660px}
}
</style>
</head>

<body>
<div class="app">
    <div class="bar">
        <div class="brand">玩偶<b>聚合</b></div>
        <form class="search" id="searchForm">
            <input id="kw" placeholder="搜索影视剧名...">
            <button>搜索</button>
        </form>
        <button class="btn" id="aggBtn">聚合</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="chips" id="chips"></div>
    <div class="status" id="status">准备加载…</div>
    <main id="content"></main>
</div>

<div class="sheet" id="sheet">
    <div class="panel" id="panel"></div>
</div>

<script>
(function(){'use strict';if(window.fongmiBridge||window.fm)document.documentElement.classList.add('fm-native');
const SITES=[
{id:'wanou',name:'玩偶',domains:['https://wogg.xxooo.cf','https://www.wogg.net'],listSelector:'.module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',categoryUrl:'/vodshow/{categoryId}--------{page}---.html',searchUrl:'/vodsearch/-------------.html?wd={keyword}&page={page}',cats:[['44','臻彩'],['1','电影'],['2','电视剧'],['3','动漫'],['4','综艺'],['5','音乐'],['6','短剧'],['46','纪录片']]},
{id:'muou',name:'木偶',domains:['https://www.muou.site','https://www.muou.asia','https://666.666291.xyz'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['25','臻选'],['1','电影'],['2','电视剧'],['3','动漫'],['4','纪录片'],['29','综艺'],['30','原盘']]},
{id:'labi',name:'蜡笔',domains:['http://xiaocgege.shop'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['29','臻彩'],['1','电影'],['2','电视剧'],['3','动漫'],['4','综艺'],['5','短剧'],['24','蜡笔4K']]},
{id:'zhizhen',name:'至臻',domains:['https://www.mihdr.top','https://mihdr.top'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['26','臻彩'],['1','电影'],['2','电视剧'],['3','动漫'],['4','综艺'],['5','短剧'],['24','老剧']]},
{id:'erxiao',name:'二小',domains:['https://2xiaopan.top'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['4','臻彩'],['1','电影'],['2','电视剧'],['3','动漫'],['21','综艺']]},
{id:'huban',name:'虎斑',domains:['http://38.76.197.172:16969','http://103.45.162.207:20720','http://xhban.xyz:20720'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['6','臻彩'],['1','电影'],['2','电视剧'],['3','综艺'],['4','动漫'],['5','短剧'],['30','115网盘']]},
{id:'kuaiying',name:'快映',domains:['http://103.45.162.207:12512','http://38.76.197.172:12521'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['5','臻彩'],['1','电影'],['2','电视剧'],['3','综艺'],['4','动漫'],['6','短剧'],['30','115'],['35','123'],['36','天移迅']]},
{id:'shandian',name:'闪电',domains:['http://shandian.blog','http://sd.sduc.site'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['1','电影'],['2','电视剧'],['3','综艺'],['4','动漫'],['30','短剧']]},
{id:'ouge',name:'欧哥',domains:['https://woog.nxog.eu.org'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['1','电影'],['2','电视剧'],['3','动漫'],['4','综艺'],['5','短剧'],['21','综合']]}
];
let activeSite='wanou',activeCat='',page=1,aggregate=true,last=[];
const $=s=>document.querySelector(s),tabs=$('#tabs'),chips=$('#chips'),content=$('#content'),status=$('#status');
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'"'}[c]))}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
function site(){return SITES.find(x=>x.id===activeSite)||SITES[0]}
function abs(base,u){try{return new URL(u,base+'/').href}catch(e){return u||''}}
async function req(url){
status.textContent='请求：'+url;
if(window.fm&&fm.req){
let r=await fm.req(url,{method:'GET',headers:{'User-Agent':'Mozilla/5.0','Referer':url},responseType:'text',timeout:16});
if(!r.ok)throw new Error(r.error||('HTTP '+r.status));
return r.body||''
}
let r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0'}});
return await r.text()
}
async function get(site,path){
let lastErr='';
for(let d of site.domains){
let u=path.startsWith('http')?path:d.replace(/\/+$/,'')+path;
try{
let h=await req(u);
if(h&&!/just a moment|cf-browser|access denied/i.test(h))return{html:h,base:d.replace(/\/+$/,'')}
}catch(e){lastErr=e.message}
}
throw new Error(lastErr||'全部域名失败')
}
function doc(h){return new DOMParser().parseFromString(h,'text/html')}
function imgUrl(u){
if(!u)return'';
u=u.replace(/^\/\//,'https://');
let m=u.match(/^https?:\/\/image\.baidu\.com\/search\/down\?url=([^&]+)/i);
return m?decodeURIComponent(m[1]):u
}
function cardFrom(el,base,site){
let a=el.querySelector('a[href]')||el.closest('a[href]')||el,href=a.getAttribute('href')||'',img=el.querySelector('img'),
title=a.getAttribute('title')||img&&img.getAttribute('alt')||clean(el.querySelector('.module-item-title,.module-search-item-title,.video-title,.title')?.textContent)||clean(a.textContent),
pic=imgUrl(img&&(img.getAttribute('data-src')||img.getAttribute('data-original')||img.getAttribute('src'))||''),
remark=clean(el.querySelector('.module-item-note,.module-search-item-note,.video-info,.note')?.textContent)||site.name;
return{title:title.replace(/\s+/g,' ').slice(0,60),href:abs(base,href),pic:abs(base,pic),remark,siteId:site.id,siteName:site.name}
}
function renderTabs(){
tabs.innerHTML=SITES.map(s=>`<button class="tab ${activeSite===s.id?'active':''}" data-id="${s.id}">${s.name}</button>`).join('');
tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
activeSite=b.dataset.id;activeCat=site().cats[0][0];page=1;renderTabs();renderChips();loadCategory()
})
}
function renderChips(){
let s=site();
if(!activeCat&&s.cats[0])activeCat=s.cats[0][0];
chips.innerHTML=s.cats.map(c=>`<button class="chip ${activeCat===c[0]?'active':''}" data-id="${c[0]}">${c[1]}</button>`).join('');
chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
activeCat=b.dataset.id;page=1;renderChips();loadCategory()
})
}
// 首页海报卡片HTML
function card(v,i){
return`<article class="card" data-i="${i}">
<div class="poster">
${v.pic?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(v.pic)}">`:'<div class="noimg">影</div>'}
<span class="badge">${esc(v.siteName)}</span>
</div>
<div class="meta">
<div class="name">${esc(v.title)}</div>
</div>
</article>`
}
function renderGrid(list,pager){
last=list;
content.innerHTML=list.length?`<div class="grid">${list.map(card).join('')}</div>${pager?`<div class="pager"><button id="prev" ${page<=1?'disabled':''}>上一页</button><button id="next">下一页</button></div>`:''}`:'<div class="empty">暂无影视资源</div>';
content.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(list[parseInt(c.dataset.i)]));
let p=$('#prev'),n=$('#next');
if(p)p.onclick=()=>{if(page>1){page--;loadCategory()}};
if(n)n.onclick=()=>{page++;loadCategory()}
}
function catUrl(s,c,p){
if(s.categoryUrl)return s.categoryUrl.replace('{categoryId}',c).replace('{page}',p);
return `/index.php/vod/show/id/${c}/page/${p}.html`
}
async function loadCategory(){
content.innerHTML='<div class="empty">正在加载影视海报…</div>';
let s=site();
try{
let r=await get(s,catUrl(s,activeCat,page)),d=doc(r.html),els=[...d.querySelectorAll(s.listSelector||'.module-item')],
list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,60);
renderGrid(list,true);
status.textContent=`${s.name} · 第 ${page} 页 · ${list.length} 部影视`
}catch(e){
content.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'
}
}
async function searchSite(s,q){
let path=s.searchUrl?s.searchUrl.replace('{keyword}',encodeURIComponent(q)).replace('{page}',1):`/index.php/vod/search/page/1/wd/${encodeURIComponent(q)}.html`;
let r=await get(s,path),d=doc(r.html),els=[...d.querySelectorAll(s.searchListSelector||'.module-search-item')];
let list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,20);
return list
}
function normName(t){
return clean(t).replace(/[《》\[\]【】\s·.\-_:：]/g,'').replace(/第[一二三四五六七八九十\d]+季|Season\s*\d+/ig,'').toLowerCase()
}
async function search(q){
content.innerHTML='<div class="empty">聚合搜索影视中…</div>';
let arr=[];
if(aggregate){
let rs=await Promise.allSettled(SITES.map(s=>searchSite(s,q)));
rs.forEach(r=>{if(r.status==='fulfilled')arr=arr.concat(r.value)});
let map=new Map();
arr.forEach(x=>{
let k=normName(x.title);
if(!map.has(k))map.set(k,Object.assign({},x,{sources:[x]}));
else map.get(k).sources.push(x)
});
arr=[...map.values()]
}else arr=await searchSite(site(),q);
renderGrid(arr,false);
status.textContent=`搜索结果：${q} · ${arr.length} 部`
}
function panType(u){
u=String(u||'').toLowerCase();
if(u.includes('pan.baidu'))return'百度网盘';
if(u.includes('quark'))return'夸克网盘';
if(u.includes('aliyun')||u.includes('alipan'))return'阿里云盘';
if(u.includes('xunlei'))return'迅雷';
if(u.includes('115.com'))return'115网盘';
if(u.includes('123'))return'123云盘';
if(u.includes('cloud.189'))return'天翼云';
if(u.includes('caiyun')||u.includes('139'))return'移动彩云';
return'网盘资源'
}
async function parseDetail(v){
let sources=v.sources||[v],all=[];
let main=null;
for(let src of sources.slice(0,5)){
let s=SITES.find(x=>x.id===src.siteId)||site();
try{
let r=await get(s,src.href),d=doc(r.html);
if(!main){
let title=clean(d.querySelector('h1,.title,.module-info-heading h1')?.textContent)||src.title,
pic=imgUrl(d.querySelector('.module-info-poster img,.detail-pic img,img')?.getAttribute('src')||src.pic),
desc=clean(d.querySelector('.module-info-introduction,.desc,.module-info-content')?.textContent)||'';
main={title,pic:abs(r.base,pic),desc,siteName:src.siteName}
}
let txtEls=[...d.querySelectorAll(s.detailPanSelector||'.module-row-info p')];
txtEls.forEach(p=>{
let t=clean(p.textContent);
if(/^https?:/.test(t))all.push({name:src.siteName+' · '+panType(t),url:t,type:panType(t),siteName:src.siteName})
});
[...d.querySelectorAll('a[href]')].forEach(a=>{
let u=a.getAttribute('href')||'';
if(/pan\.baidu|quark|aliyun|alipan|xunlei|115\.com|123|cloud\.189|caiyun|magnet:/i.test(u))
all.push({name:src.siteName+' · '+(clean(a.textContent)||panType(u)),url:abs(r.base,u),type:panType(u),siteName:src.siteName})
})
}catch(e){}
}
let seen=new Set();
all=all.filter(x=>x.url&&!seen.has(x.url)&&(seen.add(x.url)||true));
return{info:main||v,pans:all}
}

location.href=u
}
