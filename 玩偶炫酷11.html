<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>玩偶聚合 WebHome</title>
<style>
:root{
  --text:#f7fbff;
  --muted:rgba(247,251,255,.68);
  --line:rgba(255,255,255,.16);
  --soft:rgba(42,50,58,.44);
  --soft-blur:rgba(22,28,36,.6);
  --accent:#ff6b35;
  --accent2:#ffb86b;
  --accent-grad:linear-gradient(135deg,#ff6b35,#ffb86b);
  --green:#42e88a;
  --green-glow:0 0 14px rgba(66,232,138,.35);
  --radius:18px;
  --radius-full:999px;
  --radius-md:14px;
}
body.neon{
  --text:#ffffff;
  --bg:#080c1a;
  --soft-blur:rgba(10,16,40,.7);
  --accent:#35a8ff;
  --accent2:#6bd9ff;
  --accent-grad:linear-gradient(135deg,#35a8ff,#6bd9ff);
  --green:#8a42e8;
  --green-glow:0 0 14px rgba(138,66,232,.35);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:transparent;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif
}
html:not(.fm-native),html:not(.fm-native) body{background:#222a32}
/* 滚动条美化 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.05)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:var(--radius-full)}
.app{min-height:100vh;padding:10px}
.bar{display:flex;align-items:center;gap:8px}
.brand{font-size:21px;font-weight:900;white-space:nowrap}
.brand b{color:var(--accent2)}
.search-wrap{position:relative;flex:1;display:flex;gap:8px;align-items:center}
.search{
  flex:1;display:flex;gap:8px;align-items:center;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:6px 7px 6px 13px
}
.search input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:var(--text);font-size:15px
}
.search input::placeholder{color:var(--muted)}
/* 搜索历史下拉 */
.search-history{
  position:absolute;top:calc(100% + 6px);left:0;width:calc(100% - 100px);
  background:var(--soft-blur);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:var(--radius);padding:8px;
  z-index:99;display:none
}
.search-history.active{display:block}
.search-his-item{
  padding:6px 10px;border-radius:var(--md);cursor:pointer;
  transition:.15s;background:transparent
}
.search-his-item:hover{background:rgba(255,255,255,.08)}
.search button,.btn{
  border:1px solid var(--line);background:var(--soft);
  color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px;
  transition:.18s
}
.search button,.primary{
  border-color:rgba(255,107,53,.45);
  background:linear-gradient(135deg,rgba(255,107,53,.9),rgba(255,184,107,.72));
  color:#17110d;font-weight:800
}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.96)}
.tabs,.chips{
  display:flex;gap:8px;overflow:auto;padding:10px 2px 0;
  scrollbar-width:none
}
.tab,.chip{
  white-space:nowrap;border-radius:999px;padding:8px 14px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:var(--muted);font-weight:700;transition:.18s
}
.tab:hover,.chip:hover{background:rgba(255,255,255,.12)}
.tab.active,.chip.active{
  background:rgba(66,232,138,.13);
  border-color:rgba(66,232,138,.62);
  color:var(--green);font-weight:900;box-shadow:var(--green-glow)
}
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin:10px 2px;color:var(--muted);font-size:14px
}
.clear-btn{background:transparent;border:none;color:#ff6868;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{
  border-radius:15px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.12);
  position:relative;transition:.2s
}
.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 8px 24px #0004}
/* 收藏按钮 */
.fav-btn{
  position:absolute;top:8px;right:8px;z-index:2;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  border:none;color:#fff;font-size:16px;display:grid;place-items:center
}
.fav-btn.active{color:#ff4757}
/* 清晰度角标 */
.quality-badge{
  position:absolute;top:8px;left:8px;z-index:2;
  padding:2px 7px;border-radius:6px;font-size:10px;font-weight:bold;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px)
}
/* 卡片悬浮提示 */
.card-tip{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  width:200px;padding:8px;background:#000d;
  backdrop-filter:blur(6px);border-radius:var(--radius-md);
  font-size:12px;white-space:normal;opacity:0;visibility:hidden;
  transition:.2s;pointer-events:none;z-index:3
}
.card:hover .card-tip{opacity:1;visibility:visible;bottom:calc(100% + 6px)}
.poster{
  aspect-ratio:3/4;background:rgba(255,255,255,.08);
  position:relative;overflow:hidden
}
.poster img{
  width:100%;height:100%;object-fit:cover;
  transition:.3s
}
.card:hover .poster img{transform:scale(1.06)}
.noimg{
  height:100%;display:grid;place-items:center;
  color:var(--muted);font-size:28px
}
.badge{
  position:absolute;right:7px;top:34px;padding:3px 8px;
  border-radius:999px;background:rgba(0,0,0,.58);
  font-size:11px;font-weight:800;backdrop-filter:blur(4px)
}
.meta{padding:8px}
.name{
  font-weight:800;font-size:13px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.remark{
  margin-top:4px;color:var(--muted);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.pager{display:flex;gap:8px;justify-content:center;margin:14px 0}
.pager button{
  padding:8px 16px;border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);color:var(--text);transition:.18s
}
.pager button:hover{background:rgba(255,255,255,.12)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.sheet{
  position:fixed;inset:0;z-index:40;display:none;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  overflow:auto;padding:12px
}
.sheet.active{display:block}
.panel{
  background:linear-gradient(135deg,rgba(64,35,30,.72),rgba(30,24,24,.58));
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;padding:16px 12px 24px;margin-bottom:42px
}
.head{display:grid;grid-template-columns:38% 1fr;gap:14px}
.pic{
  width:100%;aspect-ratio:3/4;object-fit:cover;
  border-radius:16px;background:rgba(255,255,255,.08)
}
.title{font-size:22px;font-weight:700;line-height:1.25}
.info{
  font-size:14px;line-height:1.65;color:rgba(255,255,255,.75);
  max-height:230px;overflow:hidden
}
.pill{
  display:inline-block;margin:18px 0 10px;padding:8px 18px;
  border-radius:999px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,184,107,.55);font-size:15px;font-weight:800
}
.desc{
  font-size:15px;line-height:1.75;color:rgba(255,255,255,.72)
}
.pan-list{display:grid;gap:9px}
.pan-item{
  display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;
  align-items:center;padding:11px;border-radius:14px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);transition:.18s
}
.pan-item:hover{background:rgba(255,255,255,.12)}
.pan-type{
  padding:4px 9px;border-radius:999px;
  background:rgba(255,184,107,.18);color:var(--accent2);
  font-size:12px;font-weight:900
}
.pan-name{
  font-size:14px;font-weight:900;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.pan-url{
  color:var(--muted);font-size:11px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
.copy-btn{
  padding:6px 10px;border-radius:var(--radius-md);
  background:rgba(255,255,.1);border:1px solid var(--line);
  font-size:12px;color:var(--text)
}
.empty{
  padding:34px 18px;text-align:center;color:var(--muted);
  background:var(--soft);border:1px dashed var(--line);
  border-radius:var(--radius);font-size:15px
}
@media(min-width:720px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .app{padding:18px 28px}
  .head{grid-template-columns:180px 1fr}
  .pic{width:180px}
}
@media(min-width:1100px){
  .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
  .app{max-width:1380px;margin:0 auto}
  .sheet{max-width:1180px;margin:0 auto}
}
</style>
</head>
<body>
<div class="app">
<div class="bar">
<div class="brand">玩偶<b>聚合</b></div>
<div class="search-wrap">
<form class="search" id="searchForm">
<input id="kw" placeholder="聚合搜索网盘…">
<button class="primary">搜索</button>
</form>
<div class="search-history" id="searchHistoryBox"></div>
</div>
<button class="btn" id="aggBtn">聚合</button>
<button class="btn" id="themeBtn">切换主题</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="chips" id="chips"></div>
<div class="status-bar">
<span id="status">准备加载…</span>
<button class="clear-btn" id="clearAllBtn" style="display:none">清空全部记录</button>
</div>
<main id="content"></main>
</div>
<div class="sheet" id="sheet">
<div class="panel" id="panel"></div>
</div>
<script>(function(){'use strict';
// ========== 新增本地存储常量 ==========
const STORAGE_FAV = "wo_fav";
const STORAGE_HIST = "wo_history";
const STORAGE_SEARCH = "wo_search";
const STORAGE_SOURCE_CACHE = "wo_source";
let favList = JSON.parse(localStorage.getItem(STORAGE_FAV) || "[]");
let historyList = JSON.parse(localStorage.getItem(STORAGE_HIST) || "[]");
let searchHis = JSON.parse(localStorage.getItem(STORAGE_SEARCH) || "[]");
let sourceCache = JSON.parse(localStorage.getItem(STORAGE_SOURCE_CACHE) || "{}");
// 存储工具
function saveFav(){localStorage.setItem(STORAGE_FAV, JSON.stringify(favList))}
function saveHist(){localStorage.setItem(STORAGE_HIST, JSON.stringify(historyList))}
function saveSearch(){localStorage.setItem(STORAGE_SEARCH, JSON.stringify(searchHis))}
function saveSource(){localStorage.setItem(STORAGE_SOURCE_CACHE, JSON.stringify(sourceCache))}
function isFav(item){return favList.some(i=>i.href === item.href)}
function toggleFav(item){
  const idx = favList.findIndex(i=>i.href === item.href);
  idx > -1 ? fav.splice(idx,1) : favList.unshift(item);
  saveFav(); renderGrid(last,true);
}
function addHistory(item){
  let idx = historyList.findIndex(i=>i.href === item.href);
  if(idx > -1) historyList.splice(idx,1);
  historyList.unshift(item);
  if(historyList.length>60) historyList.length=60;
  saveHist();
}
function addSearchWord(word){
  if(!word.trim()) return;
  let i = searchHis.indexOf(word);
  if(i>-1) searchHis.splice(i);
  searchHis.unshift(word);
  if(searchHis.length>12) searchHis.length=12;
  saveSearch();
  renderSearchHistory();
}
function renderSearchHistory(){
  const box = document.getElementById("searchHistoryBox");
  if(searchHis.length===0){box.classList.remove("active");return}
  box.classList.add("active");
  box.innerHTML = searchHis.map(k=>`<div class="search-his-item" data-key="${esc(k)}">${esc(k)}</div>`).join("");
  box.querySelectorAll(".search-his-item").forEach(el=>{
    el.onclick = ()=>{
      document.getElementById("kw").value = el.dataset.key;
      box.classList.remove();
      search(el.dataset.key);
    }
  })
}
function clearAllStorage(){
  if(!confirm("确定清空收藏/历史/搜索记录？")) return;
  favList=[];historyList=[];searchHis=[];sourceCache={};
  saveFav();saveHist();saveSearch();saveSource();
  renderTabs();renderChips();loadCategory();
}
// 清晰度识别
function getQuality(text){
  if(/4K|2160/.test(text)) return "4K";
  if(/1080|1080P/.test(text)) return "1080P";
  if(/720|720P/.test(text)) return "720P";
  return "";
}
if(window.fongmiBridge||window.fm)document.documentElement.classList.add('fm-native');
const SITES=[
{id:'wanou',name:'玩偶',domains:['https://wogg.xxooo.cf','https://www.wogg.net'],listSelector:'.module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',categoryUrl:'/vodshow/{categoryId}--------{page}---.html',searchUrl:'/vodsearch/-------------.html?wd={keyword}&page={page}',cats:[['history','最近'],['fav','收藏'],['44','臻彩'],['1','电影'],['2','电视剧'],['3','动漫'],['4','综艺'],['5','音乐'],['6','短剧'],['46','纪录片']]},
{id:'muou',name:'木偶',domains:['https://www.muou.site','https://www.muou.asia','https://666.666291.xyz'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['25','臻选'],['1','电影'],['2','电视剧'],['3','动漫'],['4','纪录片'],['29','综艺'],['30','原盘']]},
{id:'labi',name:'蜡笔',domains:['http://xiaocgege.shop'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['29','臻彩'],['1','电影'],['2','电视剧'],['3','动漫'],['4','综艺'],['5','短剧'],['24','蜡笔4K']]},
{id:'zhizhen',name:'至臻',domains:['https://www.mihdr.top','https://mihdr.top'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['26','臻彩'],['1','电影'],['2','电视剧'],['3','动漫'],['4','综艺'],['5','短剧'],['24','老剧']]},
{id:'erxiao',name:'二小',domains:['https://www.2xiaopan.top'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['4','臻彩'],['1','电影'],['2','电视剧'],['3','动漫'],['21','综艺']]},
{id:'huban',name:'虎斑',domains:['http://38.76.197.172:16969','http://103.45.162.207:20720','http://xhban.xyz:20720'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['6','臻彩'],['1','电影'],['2','电视剧'],['3','综艺'],['4','动漫'],['5','短剧'],['30','115网盘']]},
{id:'kuaiying',name:'快映',domains:['http://103.45.162.207:12512','http://38.76.197.172:12521'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['5','臻彩'],['1','电影'],['2','电视剧'],['3','综艺'],['4','动漫'],['6','短剧'],['30','115'],['35','123'],['36','天移迅']]},
{id:'shandian',name:'闪电',domains:['http://shandian.blog','http://sd.sduc.site'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['1','电影'],['2','电视剧'],['3','综艺'],['4','动漫'],['30','短剧']]},
{id:'ouge',name:'欧哥',domains:['https://woog.nxog.eu.org'],listSelector:'#main .module-item',searchListSelector:'.module-search-item',detailPanSelector:'.module-row-info p',cats:[['1','电影'],['2','电视剧'],['3','动漫'],['4','综艺'],['5','短剧'],['21','综合']]}
];
let activeSite='wanou',activeCat='',page=1,aggregate=true,last=[];
const $=s=>document.querySelector(s),tabs=$('#tabs'),chips=$('#chips'),content=$('#content'),status=$('#status'),kw=$("#kw"),searchBox=$("#searchHistoryBox"),clearBtn=$("#clearAllBtn");
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'"'}[c]))}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
function site(){return SITES.find(x=>x.id===activeSite)||SITES[0]}
function abs(base,u){try{return new URL(u,base+'/').href}catch(e){return u||''}}
async function req(url){
  status.textContent='请求：'+url;
  if(window.fm&&fm.req){
    let r=await fm.req(url,{method:'GET',headers:{'User-Agent':'Mozilla/5.0','Referer':url},responseType:'text',timeout:16});
    if(!r.ok)throw new Error(r.error||('HTTP '+r.status));
    return r.body||''
  }
  let r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0'}});
  return await r.text()
}
async function get(site,path){
  let lastErr='';
  for(let d of site.domains){
    let u=path.startsWith('http')?path:d.replace(/\/+$/,'')+path;
    try{
      let h=await req(u);
      if(h&&!/just a moment|cf-browser|access denied/i.test(h))return{html:h,base:d.replace(/\/+$/,'')}
    }catch(e){lastErr=e.message}
  }
  throw new Error(lastErr||'全部域名失败')
}
function doc(h){return new DOMParser().parseFromString(h,'text/html')}
function imgUrl(u){
  if(!u)return'';
  u=u.replace(/^\/\//,'https://');
  let m=u.match(/^https?:\/\/image\.baidu\.com\/search\/down\?url=([^&]+)/i);
  return m?decodeURIComponent(m[1]):u
}
// 改造cardFrom，增加清晰度、sources缓存读取
function cardFrom(el,base,site){
  let a=el.querySelector('a[href]')||el.closest('a[href]')||el,href=a.getAttribute('href')||'',img=el.querySelector('img'),title=a.getAttribute('title')||img&&img.getAttribute('alt')||clean(el.querySelector('.module-item-title,.module-search-item-title,.video-title,.title')?.textContent)||clean(a.textContent),pic=imgUrl(img&&(img.getAttribute('data-src')||img.getAttribute('data-original')||img.getAttribute('src'))||''),remark=clean(el.querySelector('.module-item-note,.module-search-item-note,.video-info,.note')?.textContent)||site.name;
  const q = get(title + " " + remark);
  const item = {
    title:title.replace(/\s+/g,' ').slice(0,60),
    fullTitle: title,
    href:abs(base,href),
    pic:abs(base,pic),
    remark,
    siteId:site.id,
    siteName:site.name,
    quality: q,
    sources: []
  };
  if(sourceCache[item.href]) item.sources = sourceCache[item.href];
  return item;
}
function renderTabs(){
  tabs.innerHTML=SITES.map(s=>`<button class="tab ${activeSite===s.id?'active':''}" data-id="${s.id}">${s.name}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    activeSite=b.dataset.id;
    activeCat=site().cats[0][0];
    page=1;renderTabs();renderChips();loadCategory()
  })
}
function renderChips(){
  let s=site();
  if(!activeCat&&s.cats[0])activeCat=s.cats[0];
  chips.innerHTML=s.cats.map(c=>`<button class="chip ${activeCat===c[0]?'active':''}" data-id="${c[0]}">${c[1]}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b=>b.onclick=async()=>{
    activeCat=b.dataset.id;page=1;renderChips();
    if(activeCat === "history"){
      renderGrid(historyList,false);
      status.textContent=`浏览历史 ${historyList}条`;
      clearBtn.style="display:block";
    }else if(activeCat === "fav"){
      renderGrid(favList,false);
      status.textContent=`我的收藏 ${favList}条`;
      clearBtn.style="display:block";
    }else{
      clearBtn.style="display:none";
      loadCategory();
    }
  })
}
// 卡片渲染：新增爱心、清晰度、悬浮提示，无资源角标
function card(v,i){
  const favActive = isFav(v) ? "active" : "";
  const qualityTag = v.quality ? `<span class="quality-badge">${esc(v.quality)}</span>` : "";
  return`<article class="card" data-i="${i}" data-href="${esc(v.href)}">
  <button class="fav-btn ${favActive}" data-href="${esc(v.href)}">♥</button>
  <div class="card-tip">${esc(v.fullTitle)}<br><small style="opacity:.7">${esc(v.remark)}</small></div>
  <div class="poster">
    ${qualityTag}
    ${v.pic?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(v.pic)}">`:'<div class="noimg">偶</div>'}
    <span class="badge">${esc(v.siteName)}</span>
  </div>
  <div class="meta">
    <div class="name">${esc(v.title)}</div>
    <div class="remark">${esc(v.remark)}</div>
  </div>
</article>`
}
function renderGrid(list,pager){
  last=list;
  content.innerHTML=list.length?`<div class="grid">${list.map(card).join('')}</div>${pager?`<div class="pager"><button id="prev" ${page<=1?'disabled':''}>上一页</button><button id="next">下一页</button></div>`:''}`:'<div class="empty">暂无内容</div>';
  // 收藏按钮事件
  content.querySelectorAll(".fav-btn").forEach(btn=>{
    btn.onclick = e=>{
      e.stopPropagation();
      const h = btn.dataset.href;
      const item = list.find(x=>x.href === h);
      if(item) toggleFav(item);
    }
  })
  content.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(list[parseInt(c.dataset.i)]));
  let p=$('#prev'),n=$('#next');
  if(p)p.onclick=()=>{if(page>1){page--;loadCategory()}};
  if(n)n.onclick=()=>{page++;loadCategory()}
}
function catUrl(s,c,p){
  if(s.categoryUrl)return s.categoryUrl.replace('{categoryId}',c).replace('{page}',p);
  return `/index.php/vod/show/id/${c}/page/${p}.html`
}
async function loadCategory(){
  content.innerHTML='<div class="empty">加载中…</div>';
  let s=site();
  try{
    let r=await get(s,catUrl(s,activeCat,page)),d=doc(r.html),els=[...d.querySelectorAll(s.listSelector||'.module-item')],list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,60);
    renderGrid(list,true);
    status.textContent=`${s.name} · 第 ${page} 页 · ${list.length} 条`
  }catch(e){content.innerHTML='<div class="empty">分类失败：'+esc(e.message)+'</div>'}
}
async function searchSite(s,q){
  let path=s.searchUrl?s.searchUrl.replace('{keyword}',encodeURIComponent(q)).replace('{page}',1):`/index.php/vod/search/page/1/wd/${encodeURIComponent(q)}.html`;
  let r=await get(s,path),d=doc(r.html),els=[...d.querySelectorAll(s.searchListSelector||'.module-search-item')];
  let list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,20);
  return list
}
function normName(t){return clean(t).replace(/[《》\[\]【】\s·.\-_:：]/g,'').replace(/第[一二三四五六七八九十\d]+季|Season\s*\d+/ig,'').toLowerCase()}
async function search(q){
  addSearchWord(q);
  content.innerHTML='<div class="empty">聚合搜索中…</div>';
  let arr=[];
  if(aggregate){
    let rs=await Promise.allSettled(SITES.map(s=>searchSite(s,q)));
    rs.forEach(r=>{if(r.status==='fulfilled')arr=arr.concat(r.value)});
    let map=new Map();
    arr.forEach(x=>{let k=normName(x);if(!map.has(k))map.set(k,Object.assign({},x,{sources:[x]}));else map.get(k).sources.push(x)});
    arr=[...map.values()]
  }else arr=await searchSite(s,q);
  renderGrid(arr,false);
  status.textContent=`搜索：${q} · ${arr.length} 条`
}
function panType(u){
  u=String(u||'').toLowerCase();
  if(u.includes('pan.baidu'))return'百度';
  if(u.includes('quark'))return'夸克';
  if(u.includes('aliyun')||u.includes('alipan'))return'阿里';
  if(u.includes('xunlei'))return'迅雷';
  if(u.includes('115.com'))return'115';
  if(u.includes('123'))return'123';
  if(u.includes('cloud.189'))return'天翼';
  if(u.includes('caiyun')||u.includes('139'))return'移动';
  return'网盘'
}
// 复制链接工具
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    alert("链接已复制");
  }catch(err){
    alert("复制失败："+text);
  }
}
async function parseDetail(v){
  let sources=v.sources||[v],all=[];
  let main=null;
  for(let src of sources.slice(0,5)){
    let s=SITES.find(x=>x.id===src.siteId)||site();
    try{
      let r=await get(s,src.href),d=doc(r.html);
      if(!main){
        let title=clean(d.querySelector('h1,.title,.module-info-heading h1')?.textContent)||src.title,pic=imgUrl(d.querySelector('.module-info-poster img,.detail-pic img,img')?.getAttribute('src')||src.pic),desc=clean(d.querySelector('.module-info-introduction,.desc,.module-info-content')?.textContent)||'';
        main={title,pic:abs(r.base,pic),desc,siteName:src.siteName}
      }
      let txtEls=[...d.querySelectorAll(s.detailPanSelector||'.module-row-info p')];
      txtEls.forEach(p=>{
        let t=clean(p.textContent);
        if(/^https?:/.test(t))all.push({name:src.siteName+' · '+panType(t),url:t,type:panType(t),siteName:src.siteName})
      });
      [...d.querySelectorAll('a[href]')].forEach(a=>{
        let u=a.getAttribute('href')||'';
        if(/pan\.baidu|quark|aliyun|alipan|xunlei|115\.com|123|cloud\.189|caiyun|magnet:/i.test(u))all.push({name:src.siteName+' · '+(clean(a.textContent)||panType(u)),url:abs(r.base,u),type:panType(u),siteName:src.siteName})
      })
    }catch(e){}
  }
  let seen=new Set();
  all=all.filter(x=>x.url&&!seen.has(x.url)&&(seen.add(x.url)||true));
  v.sources = all;
  sourceCache[v.href] = all;
  saveSource();
  return{info:main||v,pans:all}
}
async function openDetail(v){
  addHistory(v); // 打开存入历史
  $('#sheet').classList.add('active');
  $('#panel').innerHTML='<div class="empty">读取详情…</div>';
  try{
    let d=await parseDetail(v),info=d.info;
    let emptyTip = d.pans.length===0 ? `<div class="empty">未提取到网盘链接</div>` : "";
    // 已删除「资源：X条」文字
    $('#panel').innerHTML=`<button class="btn" id="closeBtn">返回</button>
<div class="head">
  <img class="pic" referrerpolicy="no-referrer" src="${esc(info.pic||v.pic||'')}" onerror="this.style.display='none'">
  <div>
    <div class="title">${esc(info.title||v.title)}</div>
    <div class="info">
      <div><b>来源：</b>${esc((v.sources||[v]).map(x=>x.siteName).join(' / '))}</div>
      <div><b>清晰度：</b>${v.quality||"未知"}</div>
    </div>
  </div>
</div>
<div class="pill">简介</div>
<div class="desc">${esc(info.desc||v.remark||'暂无简介')}</div>
<div class="pill">网盘资源</div>
<div class="pan-list">
${emptyTip || d.pans.map((p,i)=>`<div class="pan-item">
  <span class="pan-type">${esc(p.type)}</span>
  <div>
    <div class="pan-name">${esc(p.name)}</div>
    <div class="pan-url">${esc(p.url)}</div>
  </div>
  <button class="copy-btn" data-link="${esc(p.url)}">复制链接</button>
  <button class="btn" data-i="${i}">打开</button>
</div>`).join('')}
</div>`;
    $('#closeBtn').onclick=closeDetail;
    // 复制按钮绑定
    $('#panel').querySelectorAll(".copy-btn").forEach(btn=>{
      btn.onclick=()=>copyText(btn.dataset.link);
    })
    $('#panel').querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>playPan(d.pans[parseInt(b.dataset.i)]))
  }catch(e){
    $('#panel').innerHTML='<button class="btn" onclick="window.__woClose()">返回</button><div class="empty">详情失败：'+esc(e.message)+'</div>'
  }
}
async function playPan(p){
  let u=p.url;
  if(window.fm&&fm.play){
    await fm.play(u.startsWith('magnet:')?u:'push://'+u,p.name);
    return
  }
  location.href=u
}
function closeDetail(){$('#sheet').classList.remove('active')}
// 主题切换
$("#themeBtn").onclick = ()=> document.body.classList.toggle("neon");
clearBtn.onclick = clearAllStorage;
// 搜索框聚焦显示历史
kw.onfocus = renderSearchHistory;
document.addEventListener("click",e=>{
  if(!kw.contains(e.target) && !$("#searchHistoryBox").contains(e.target)){
    $("#searchHistoryBox").classList.remove("active");
  }
})
searchForm.onsubmit=e=>{
  e.preventDefault();
  let q=kw.value.trim();
  q?search(q):loadCategory();
  $("#searchHistoryBox").classList.remove("active");
};
aggBtn.onclick=()=>{aggregate=!aggregate;aggBtn.textContent=aggregate?'聚合':'单站'};
window.__woClose=closeDetail;
activeCat=site().cats[0];
renderTabs();renderChips();renderSearchHistory();loadCategory();
})();
</script>
